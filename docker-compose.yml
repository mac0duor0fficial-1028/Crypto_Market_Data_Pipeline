name: crypto-pipeline

x-airflow-common: &airflow-common
  build: ./airflow
  env_file: .env
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow_meta
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    PYTHONPATH: /opt/airflow
    AVRO_SCHEMA_PATH: /opt/airflow/schemas/trade_event.avsc
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./kafka/schemas:/opt/airflow/schemas:ro
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

x-spark-common: &spark-common
  build: ./spark
  image: crypto-spark:latest
  restart: unless-stopped

services:
  # ---------------------------------------------------------------- staging
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/00_create_airflow_db.sql:/docker-entrypoint-initdb.d/00_create_airflow_db.sql:ro
      - ./sql/01_postgres_schema.sql:/docker-entrypoint-initdb.d/01_postgres_schema.sql:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # -------------------------------------------------------------- streaming
  # NOTE: no env_file here. cp-kafka turns every KAFKA_* variable into a broker
  # property, so our KAFKA_BOOTSTRAP / KAFKA_TOPIC_* app variables must not leak in.
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    volumes:
      - kafkadata:/var/lib/kafka/data
    ports: ["127.0.0.1:29092:29092"]
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    ports: ["127.0.0.1:8081:8081"]
    restart: unless-stopped

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_started
    env_file: .env
    entrypoint: ["/bin/bash", "/create_topics.sh"]
    volumes:
      - ./kafka/create_topics.sh:/create_topics.sh:ro
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
    ports: ["127.0.0.1:8080:8080"]
    restart: unless-stopped

  # ---------------------------------------------------------------- serving
  cassandra:
    image: cassandra:4.1
    environment:
      CASSANDRA_CLUSTER_NAME: crypto
      MAX_HEAP_SIZE: 768M
      HEAP_NEWSIZE: 200M
    volumes:
      - cassandradata:/var/lib/cassandra
    ports: ["127.0.0.1:9042:9042"]
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 30
    restart: unless-stopped

  cassandra-init:
    image: cassandra:4.1
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./sql/02_cassandra_schema.cql:/schema.cql:ro
    entrypoint: ["/bin/bash", "-c", "cqlsh cassandra -f /schema.cql && echo 'Cassandra schema applied'"]
    restart: "no"

  # ------------------------------------------------------------- processing
  spark-master:
    <<: *spark-common
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master",
              "--host", "spark-master", "--port", "7077", "--webui-port", "8080"]
    ports: ["127.0.0.1:8082:8080"]

  spark-worker:
    <<: *spark-common
    depends_on: [spark-master]
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker",
              "spark://spark-master:7077", "--cores", "2", "--memory", "2g", "--webui-port", "8081"]
    volumes:
      - checkpoints:/checkpoints

  spark-streaming:
    <<: *spark-common
    depends_on:
      spark-master:
        condition: service_started
      spark-worker:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
      cassandra-init:
        condition: service_completed_successfully
    env_file: .env
    environment:
      CHECKPOINT_DIR: /checkpoints
      AVRO_SCHEMA_PATH: /opt/schemas/trade_event.avsc
    volumes:
      - ./spark/jobs:/opt/jobs:ro
      - ./kafka/schemas:/opt/schemas:ro
      - checkpoints:/checkpoints
      - ivycache:/tmp/.ivy
    ports: ["127.0.0.1:4040:4040"]
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - spark://spark-master:7077
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1,org.apache.spark:spark-avro_2.12:3.5.1,com.datastax.spark:spark-cassandra-connector_2.12:3.5.0
      - --conf
      - spark.jars.ivy=/tmp/.ivy
      - --conf
      - spark.driver.host=spark-streaming
      - --conf
      - spark.driver.bindAddress=0.0.0.0
      - --conf
      - spark.executor.memory=1g
      - --conf
      - spark.cores.max=2
      - /opt/jobs/stream_trades.py

  # ---------------------------------------------------------- orchestration
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        (airflow users create --username "$${AIRFLOW_ADMIN_USER}" --password "$${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Admin --lastname User --role Admin --email admin@example.com || true)
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    ports: ["127.0.0.1:8083:8080"]
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ------------------------------------------------------------------- api
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: .env
    depends_on:
      cassandra-init:
        condition: service_completed_successfully
    ports: ["127.0.0.1:8000:8000"]
    restart: unless-stopped

volumes:
  pgdata:
  kafkadata:
  cassandradata:
  checkpoints:
  ivycache:
  airflow-logs:
