services:
  postgres:
    image: postgres:16
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/01_postgres_schema.sql:/docker-entrypoint-initdb.d/01.sql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U $${POSTGRES_USER}]
      interval: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes: [kafkadata:/var/lib/kafka/data]

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    depends_on: [kafka]
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
    ports: ['8081:8081']

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on: [kafka, schema-registry]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
    ports: ['8080:8080']

  cassandra:
    image: cassandra:4.1
    volumes: [cassandradata:/var/lib/cassandra]
    healthcheck:
      test: [CMD-SHELL, cqlsh -e 'describe keyspaces']
      interval: 15s
      retries: 20

  spark-master:
    image: bitnami/spark:3.5
    environment: [SPARK_MODE=master]
    ports: ['8082:8080', '7077:7077']

  spark-worker:
    image: bitnami/spark:3.5
    depends_on: [spark-master]
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G

  airflow:
    build: ./airflow
    env_file: .env
    depends_on:
      postgres: {condition: service_healthy}
    volumes: ['./airflow/dags:/opt/airflow/dags', './src:/opt/airflow/src']
    ports: ['8083:8080']

volumes: {pgdata: {}, kafkadata: {}, cassandradata: {}}